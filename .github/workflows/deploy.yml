name: Deploy

on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'apps/marketing/**'
      - 'packages/**'
      - 'crates/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; new pushes supersede pending runs.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  WASM_BINDGEN_VERSION: 0.2.127

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.127
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: ./scripts/build-wasm.sh

      # Site root stays free for the marketing site (P8); the app lives at /app/.
      - name: Build the app for GitHub Pages
        run: pnpm --filter @onemark/web build
        env:
          ONEMARK_BASE: /onemark/app/

      # M6 gate blocks deployment, not just CI.
      - name: Bundle budget gate (M6, <2 MB gzipped)
        run: node scripts/check-bundle.mjs

      # Pages publishes the artifact at the site root: the marketing site
      # (Next.js static export) owns the root, the app lives under app/.
      - name: Build the marketing site
        run: pnpm --filter @onemark/marketing build

      - name: M6 gate for the marketing bundle
        run: node scripts/check-marketing.mjs

      - name: Stage site layout
        run: |
          mkdir -p staging/app
          cp -R apps/marketing/out/. staging/
          cp -R apps/web/dist/. staging/app/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
